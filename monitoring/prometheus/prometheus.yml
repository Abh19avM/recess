global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'recess-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8080', 'host.docker.internal:8080', 'localhost:8080']
        labels:
          app: 'recess'
          env: 'development'
