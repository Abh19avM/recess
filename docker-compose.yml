services:
  postgres:
    image: postgres:16-alpine
    container_name: recess-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recess_secret}
      POSTGRES_DB: ${POSTGRES_DB:-recess_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recess} -d ${POSTGRES_DB:-recess_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - recess-net

  redis:
    image: redis:7-alpine
    container_name: recess-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - recess-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recess-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: ${PORT:-8080}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-recess}:${POSTGRES_PASSWORD:-recess_secret}@postgres:5432/${POSTGRES_DB:-recess_db}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      READ_TIMEOUT: ${READ_TIMEOUT:-15s}
      WRITE_TIMEOUT: ${WRITE_TIMEOUT:-15s}
      IDLE_TIMEOUT: ${IDLE_TIMEOUT:-60s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - recess-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  recess-net:
    driver: bridge
